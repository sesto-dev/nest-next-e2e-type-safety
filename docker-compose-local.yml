# docker-compose.local.yml

services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nest:
    # reuse your existing build context
    build:
      context: ./nest
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  next:
    build:
      context: ./next
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000" # expose Next on localhost:3000
    environment:
      - NODE_ENV=production
    depends_on:
      - nest
volumes:
  postgres-data:
